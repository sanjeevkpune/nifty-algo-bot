name: Automated VM Start and Stop Scheduler

on:
  schedule:
    # 9:00 AM IST is 3:30 UTC (Mon-Fri)
    - cron: '30 3 * * 1-5'
    # 4:00 PM IST is 10:30 UTC (Mon-Fri)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

env:
  PROJECT_ID: "streamlit-db-503313"
  VM_NAME: "angel-one-auto-trading-bot-v2"
  ZONE: "us-central1-c"
  STATIC_IP_NAME: "algo-vm-ip"

jobs:
  manage-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Determine Action (Start or Stop)
        id: check-time
        run: |
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -eq 3 ]; then
            echo "action=start" >> $GITHUB_OUTPUT
          else
            echo "action=stop" >> $GITHUB_OUTPUT
          fi

      - name: Start / Recreate VM and Execute startup.sh
        if: steps.check-time.outputs.action == 'start'
        run: |
          if gcloud compute instances describe ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --project=${{ env.PROJECT_ID }} >/dev/null 2>&1; then
              echo "Deleting old instance for clean daily provision..."
              gcloud compute instances delete ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --project=${{ env.PROJECT_ID }} --quiet
          fi

          echo "Creating fresh VM, binding static IP, and passing secrets into metadata..."
          gcloud compute instances create ${{ env.VM_NAME }} \
              --zone=${{ env.ZONE }} \
              --project=${{ env.PROJECT_ID }} \
              --machine-type=e2-micro \
              --image-family=ubuntu-2204-lts \
              --image-project=ubuntu-os-cloud \
              --boot-disk-size=20GB \
              --tags=http-server,https-server \
              --address=${{ env.STATIC_IP_NAME }} \
              --metadata=startup-script-url=https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/main/startup.sh,API_KEY="${{ secrets.API_KEY }}",CLIENT_CODE="${{ secrets.CLIENT_CODE }}",PIN="${{ secrets.PIN }}",TOTP_SECRET="${{ secrets.TOTP_SECRET }}",TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}",TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}",GSHEET_ID_V2="${{ secrets.GSHEET_ID_V2 }}"

      - name: Stop / Delete VM at Market Close
        if: steps.check-time.outputs.action == 'stop'
        run: |
          gcloud compute instances delete ${{ env.VM_NAME }} \
              --zone=${{ env.ZONE }} \
              --project=${{ env.PROJECT_ID }} \
              --quiet || echo "VM already deleted."
