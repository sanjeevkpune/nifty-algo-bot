name: Automated VM Start and Stop Scheduler

on:
  schedule:
    # 8:30 AM IST (3:00 UTC, Mon-Fri) -> Gives a 30 min buffer so VM is guaranteed UP by 9:00 AM IST
    - cron: '0 3 * * 1-5'
    # 4:00 PM IST (10:30 UTC, Mon-Fri) -> Triggers STOP at 4:00 PM IST
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to perform'
        required: true
        default: 'start_or_sync'
        type: choice
        options:
          - start_or_sync
          - stop

env:
  PROJECT_ID: "streamlit-db-503313"
  VM_NAME: "angel-one-auto-trading-bot-v2"
  ZONE: "us-central1-c"
  STATIC_IP_NAME: "algo-vm-ip"

jobs:
  manage-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Stop GCP VM
        if: github.event.inputs.action_type == 'stop' || (github.event_name == 'schedule' && github.event.schedule == '30 10 * * 1-5')
        run: |
          gcloud compute instances stop ${{ env.VM_NAME }} --zone ${{ env.ZONE }}

      - name: Start GCP VM & Update Secrets
        if: github.event.inputs.action_type == 'start_or_sync' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1-5')
        run: |
          gcloud compute instances add-metadata ${{ env.VM_NAME }} \
            --zone ${{ env.ZONE }} \
            --metadata api-key="${{ secrets.API_KEY }}",client-code="${{ secrets.CLIENT_CODE }}",pin="${{ secrets.PIN }}",totp-secret="${{ secrets.TOTP_SECRET }}",dhan-client-id="${{ secrets.DHAN_CLIENT_ID }}",dhan-access-token="${{ secrets.DHAN_ACCESS_TOKEN }}",telegram-token="${{ secrets.TELEGRAM_BOT_TOKEN }}",telegram-chat="${{ secrets.TELEGRAM_CHAT_ID }}",gsheet-v2="${{ secrets.GSHEET_ID_V2 }}",gcp-sa-b64="${{ secrets.GCP_SA_B64 }}"

          gcloud compute instances start ${{ env.VM_NAME }} --zone ${{ env.ZONE }}
