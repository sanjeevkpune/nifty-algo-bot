name: VM Scheduler

on:
  schedule:
    - cron: '0 3 * * 1-5' # 8:30 AM IST (Monday-Friday)
  workflow_dispatch:

env:
  PROJECT_ID: "streamlit-db-503313" # Keep your existing project ID
  ZONE: "us-central1-c"             # Keep your existing zone
  VM_NAME: "angel-one-auto-trading-bot-v2"           # Keep your existing VM name

jobs:
  manage-vm:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_JSON }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Start GCP VM & Update Secrets
        run: |
          gcloud compute instances add-metadata ${{ env.VM_NAME }} \
            --zone ${{ env.ZONE }} \
            --metadata api-key="${{ secrets.API_KEY }}",client-code="${{ secrets.CLIENT_CODE }}",pin="${{ secrets.PIN }}",totp-secret="${{ secrets.TOTP_SECRET }}",dhan-client-id="${{ secrets.DHAN_CLIENT_ID }}",dhan-access-token="${{ secrets.DHAN_ACCESS_TOKEN }}",telegram-token="${{ secrets.TELEGRAM_BOT_TOKEN }}",telegram-chat="${{ secrets.TELEGRAM_CHAT_ID }}",gsheet-v2="${{ secrets.GSHEET_ID_V2 }}",gcp-sa-b64="${{ secrets.GCP_SA_B64 }}"

          gcloud compute instances start ${{ env.VM_NAME }} --zone ${{ env.ZONE }}
