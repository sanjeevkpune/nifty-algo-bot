name: Automated VM Start and Stop Scheduler

on:
  schedule:
    # 9:00 AM IST is 3:30 UTC (Mon-Fri) -> START VM
    - cron: '30 3 * * 1-5'
    # 4:00 PM IST is 10:30 UTC (Mon-Fri) -> STOP VM
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual testing anytime

env:
  PROJECT_ID: "streamlit-db-503313"
  VM_NAME: "angel-one-auto-trading-bot-v2"
  ZONE: "us-central1-c"

jobs:
  manage-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Determine Action (Start or Stop)
        id: check-time
        run: |
          UTC_HOUR=$(date -u +%H)
          echo "Current UTC Hour: $UTC_HOUR"
          
          # If triggered near 03:30 UTC (9:00 AM IST) -> action = start
          # If triggered near 10:30 UTC (4:00 PM IST) -> action = stop
          # For manual workflow_dispatch testing, default to 'start' if not specified
          if [ "$UTC_HOUR" -lt 8 ]; then
            echo "action=start" >> $GITHUB_OUTPUT
          else
            echo "action=stop" >> $GITHUB_OUTPUT
          fi

      - name: Start VM Instance
        if: steps.check-time.outputs.action == 'start'
        run: |
          echo "Starting VM instance ${{ env.VM_NAME }}..."
          gcloud compute instances start ${{ env.VM_NAME }} \
              --zone=${{ env.ZONE }} \
              --project=${{ env.PROJECT_ID }} \
              || echo "VM is already running or starting."

      - name: Stop VM Instance
        if: steps.check-time.outputs.action == 'stop'
        run: |
          echo "Stopping VM instance ${{ env.VM_NAME }}..."
          gcloud compute instances stop ${{ env.VM_NAME }} \
              --zone=${{ env.ZONE }} \
              --project=${{ env.PROJECT_ID }} \
              || echo "VM is already stopped."
