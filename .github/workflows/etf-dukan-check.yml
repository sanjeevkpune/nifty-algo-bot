name: ETF Bot Setup Check

# Runs etf_dukan/check_setup.py on the VM over SSH and shows the PASS / FAIL table in the log.
# Read-only unless you pick an order test (one real 1-unit LIMIT buy far below the price, cancelled at once).
# AngelOne checks are skipped from 9:30 am to 3:15 pm IST so the strangle bot's session is not disturbed.
# Best times: 9:15-9:30 am IST (order test works then) or after 3:30 pm IST (VM stops at 4 pm).

on:
  workflow_dispatch:
    inputs:
      check:
        description: 'What to check'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - angelone-only
          - angelone-only + order test (REAL order, cancelled at once)
      quick:
        description: 'Quick RSI (8 symbols instead of the whole universe)'
        type: boolean
        default: false

env:
  PROJECT_ID: "streamlit-db-503313"
  VM_NAME: "angel-one-auto-trading-bot-v2"
  ZONE: "us-central1-c"
  VM_USER: "kumar_sanjeev_pune"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run the setup check on the VM
        env:
          CHECK: ${{ github.event.inputs.check }}
          QUICK: ${{ github.event.inputs.quick }}
        run: |
          STATUS=$(gcloud compute instances describe "$VM_NAME" --zone="$ZONE" --project="$PROJECT_ID" --format='get(status)')
          if [ "$STATUS" != "RUNNING" ]; then
            echo "::error::The VM is $STATUS. Start it with the 'Automated VM Start and Stop Scheduler' workflow (start_or_sync), then run this again."
            exit 1
          fi
          ARGS=""
          case "$CHECK" in
            angelone-only) ARGS="--angel-only" ;;
            angelone-only*order*) ARGS="--angel-only --order-test" ;;
          esac
          [ "$QUICK" = "true" ] && ARGS="$ARGS --quick"
          echo "Running: python3 check_setup.py $ARGS"
          gcloud compute ssh "${VM_USER}@${VM_NAME}" --zone="$ZONE" --project="$PROJECT_ID" --quiet \
            --command="cd ~/trading-bot/etf_dukan 2>/dev/null || { echo 'etf_dukan folder missing: run VM Scheduler start_or_sync first'; exit 1; }; \
                       [ -f check_setup.py ] || { echo 'check_setup.py missing on the VM: run VM Scheduler start_or_sync so it pulls main'; exit 1; }; \
                       python3 check_setup.py $ARGS"
