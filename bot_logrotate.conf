# User-mode logrotate for the bots (run from cron, see startup.sh):
#   /usr/sbin/logrotate -s ~/trading-bot/logrotate.status ~/trading-bot/bot_logrotate.conf
# copytruncate: the bots keep their file open (cron >> append), so the file is copied, then emptied.
# A log is rotated once a week, or sooner when it passes 5 MB (checked every hour).
# 8 old copies are kept, gzip-compressed; anything older than 60 days is deleted.

/home/kumar_sanjeev_pune/trading-bot/*.log
/home/kumar_sanjeev_pune/trading-bot/etf_dukan/logs/*.log
/home/kumar_sanjeev_pune/trading-bot/dashboard/*.log {
    weekly
    maxsize 5M
    rotate 8
    maxage 60
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# SmartAPI's own logs (logs/<date>/app.log): cleanup_logs.sh deletes the date folders after 3 days;
# this only caps one big day.
/home/kumar_sanjeev_pune/trading-bot/logs/*/*.log {
    size 20M
    rotate 1
    compress
    missingok
    notifempty
    copytruncate
}
